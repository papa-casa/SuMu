<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuMu AI - Intelligent Platform</title>
    <!-- Collegamento a FontAwesome per le icone di servizio -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Collegamento al file CSS esterno -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="top-section">
            <!-- Integrazione del logo completo sumus.png -->
            <div class="brand-container">
                <img src="sumus.png" alt="SuMu Logo" class="brand-logo">
            </div>
            
            <nav>
                <div class="menu-label">Moduli SuMu</div>
                <ul class="nav-links">
                    <li><a href="#" class="active"><i class="fa-regular fa-comment-dots"></i> SuMu Chat</a></li>
                    <li><a href="#"><i class="fa-solid fa-wand-magic-sparkles"></i> Creatività</a></li>
                    <li><a href="#"><i class="fa-solid fa-bolt"></i> Automazioni</a></li>
                    <li><a href="#"><i class="fa-solid fa-gear"></i> Impostazioni</a></li>
                </ul>
            </nav>
        </div>

        <div class="user-profile">
            <div class="user-avatar">U</div>
            <div class="user-info">
                <p style="font-size: 14px; font-weight: 600;">Premium User</p>
                <p style="font-size: 12px; color: var(--text-muted);">utente@sumu.ai</p>
            </div>
        </div>
    </aside>

    <!-- AREA PRINCIPALE -->
    <main class="main-content">
        <!-- HEADER -->
        <header class="header">
            <h2>SuMu Chat <span style="font-size: 13px; color: var(--blue-accent); font-weight: 500; margin-left: 8px;">• Online</span></h2>
            <div>
                <i class="fa-solid fa-sliders" style="cursor: pointer; font-size: 18px; color: var(--text-muted);"></i>
            </div>
        </header>

        <!-- AREA MESSAGGI -->
        <div class="chat-container" id="chatContainer">
            <!-- Messaggio di Benvenuto di SuMu -->
            <div class="message bot">
                <!-- Integrazione dell'icona quadrata Sumu.png come avatar dell'AI -->
                <div class="message-avatar">
                    <img src="Sumu.png" alt="SuMu Avatar">
                </div>
                <div class="message-text">
                    Benvenuto su <strong>SuMu</strong>. Sono il tuo assistente intelligente. Come posso esserti utile oggi?
                </div>
            </div>
        </div>

        <!-- INPUT PROMPT -->
        <div class="input-area">
            <div class="input-wrapper">
                <i class="fa-solid fa-paperclip" style="color: var(--text-muted); cursor: pointer; font-size: 18px;"></i>
                <input type="text" id="userInput" placeholder="Invia un messaggio a SuMu...">
                <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </main>

   <!-- SCRIPT AGGIORNATO PER L'INTELLIGENZA DI SUMU -->
    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // 1. Memoria di SuMu: Array che mantiene la cronologia dei messaggi per dare contesto all'AI
        let conversationHistory = [
            { role: "system", content: "Tu sei SuMu, un assistente AI avanzato, utile, ironico ed estremamente preparato. Rispondi sempre in italiano in modo chiaro e strutturato." }
        ];

        // Funzione principale per gestire l'invio
        async function sendMessage() {
            const text = userInput.value.trim();
            if (text === '') return;

            // Mostra il messaggio dell'utente
            appendMessage(text, 'user');
            userInput.value = '';

            // Salva nella memoria locale il messaggio dell'utente
            conversationHistory.push({ role: "user", content: text });

            // Mostra l'indicatore di caricamento (SuMu sta pensando...)
            const loaderId = appendLoader();

            try {
                // 2. CHIAMATA API REALE (Esempio con OpenAI, configurabile con il tuo backend)
                // NOTA: In produzione, esegui sempre questa chiamata lato server (Node.js/Python) per proteggere le tue chiavi API!
                
                /* 
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer LA_TUA_API_KEY'
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini', // o il modello che preferisci
                        messages: conversationHistory
                    })
                });
                
                const data = await response.json();
                const aiReply = data.choices[0].message.content;
                */

                // --- SIMULAZIONE AVANZATA (Rimuovi questo blocco quando colleghi l'API vera) ---
                const aiReply = await simulaIntelligenzaSuMu(text);
                // -------------------------------------------------------------------------------

                // Rimuovi l'animazione di caricamento
                removeLoader(loaderId);

                // Mostra la risposta di SuMu
                appendMessage(aiReply, 'bot');

                // Salva la risposta di SuMu nella memoria per i prossimi messaggi
                conversationHistory.push({ role: "assistant", content: aiReply });

            } catch (error) {
                console.error("Errore durante la richiesta a SuMu:", error);
                removeLoader(loaderId);
                appendMessage("Scusami, si è verificato un errore di connessione nei miei circuiti. Riprova tra un attimo!", 'bot');
            }
        }

        // Funzione per stampare i messaggi a schermo
        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            const avatarContent = sender === 'bot' 
                ? '<img src="Sumu.png" alt="SuMu Avatar">' 
                : 'U';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatarContent}</div>
                <div class="message-text">${analizzaMarkdown(text)}</div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Crea un indicatore visivo "SuMu sta digitando..."
        function appendLoader() {
            const loaderId = 'loader_' + Date.now();
            const loaderDiv = document.createElement('div');
            loaderDiv.classList.add('message', 'bot');
            loaderDiv.id = loaderId;

            loaderDiv.innerHTML = `
                <div class="message-avatar"><img src="Sumu.png" alt="SuMu Avatar"></div>
                <div class="message-text" style="display: flex; gap: 5px; align-items: center; padding: 12px 20px;">
                    <span class="dot-typing"></span>
                    <span class="dot-typing" style="animation-delay: 0.2s;"></span>
                    <span class="dot-typing" style="animation-delay: 0.4s;"></span>
                </div>
            `;
            chatContainer.appendChild(loaderDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return loaderId;
        }

        function removeLoader(id) {
            const loader = document.getElementById(id);
            if (loader) loader.remove();
        }

        // Un piccolissimo parser per formattare il testo dell'AI (grassetto e a capo)
        function analizzaMarkdown(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Trasforma **testo** in grassetto
                .replace(/\n/g, '<br>'); // Gestisce gli a capo
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Simulatore temporaneo che imita una vera AI analizzando il contesto
        function simulaIntelligenzaSuMu(prompt) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const p = prompt.toLowerCase();
                    if (p.includes('ciao') || p.includes('salve')) {
                        resolve("Ciao! È un piacere parlarti. Sono **SuMu**, la tua AI di fiducia. Come posso svoltarti la giornata?");
                    } else if (p.includes('chi sei') || p.includes('nome')) {
                        resolve("Sono **SuMu**, un assistente virtuale progettato con un'interfaccia personalizzata. Il mio obiettivo è aiutarti a elaborare idee, codice e automazioni in modo rapido.");
                    } else if (p.includes('funzioni') || p.includes('cosa fai')) {
                        resolve("Al momento posso simulare una conversazione intelligente, ma se mi colleghi a un modello come *GPT-4* o *Claude* tramite API posso:\n\n1. Scrivere e correggere codice\n2. Generare testi e strategie di marketing\n3. Ricordare il contesto della nostra chat!");
                    } else {
                        resolve(`Hai detto: "${prompt}". Ho analizzato la tua richiesta. Per darti una risposta reale basata sul mio cervello algoritmico, attiva il backend modificando la funzione \`sendMessage()\` nel codice!`);
                    }
                }, 1200); // Ritardo simulato per dare realismo
            });
        }
    </script>
</body>
</html>
