<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuMu AI - Intelligent Platform</title>
    <!-- Collegamento a FontAwesome per le icone di servizio -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Collegamento al file CSS esterno -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="top-section">
            <!-- Integrazione del logo completo sumus.png -->
            <div class="brand-container">
                <img src="sumus.png" alt="SuMu Logo" class="brand-logo">
            </div>
            
            <nav>
                <div class="menu-label">Moduli SuMu</div>
                <ul class="nav-links">
                    <li><a href="#" class="active"><i class="fa-regular fa-comment-dots"></i> SuMu Chat</a></li>
                    <li><a href="#"><i class="fa-solid fa-wand-magic-sparkles"></i> Creatività</a></li>
                    <li><a href="#"><i class="fa-solid fa-bolt"></i> Automazioni</a></li>
                    <li><a href="#"><i class="fa-solid fa-gear"></i> Impostazioni</a></li>
                </ul>
            </nav>
        </div>

        <div class="user-profile">
            <div class="user-avatar">U</div>
            <div class="user-info">
                <p style="font-size: 14px; font-weight: 600;">Premium User</p>
                <p style="font-size: 12px; color: var(--text-muted);">utente@sumu.ai</p>
            </div>
        </div>
    </aside>

    <!-- AREA PRINCIPALE -->
    <main class="main-content">
        <!-- HEADER -->
        <header class="header">
            <h2>SuMu Chat <span style="font-size: 13px; color: var(--blue-accent); font-weight: 500; margin-left: 8px;">• Online</span></h2>
            <div>
                <i class="fa-solid fa-sliders" style="cursor: pointer; font-size: 18px; color: var(--text-muted);"></i>
            </div>
        </header>

        <!-- AREA MESSAGGI -->
        <div class="chat-container" id="chatContainer">
            <!-- Messaggio di Benvenuto di SuMu -->
            <div class="message bot">
                <!-- Integrazione dell'icona quadrata Sumu.png come avatar dell'AI -->
                <div class="message-avatar">
                    <img src="Sumu.png" alt="SuMu Avatar">
                </div>
                <div class="message-text">
                    Benvenuto su <strong>SuMu</strong>. Sono il tuo assistente intelligente. Come posso esserti utile oggi?
                </div>
            </div>
        </div>

        <!-- INPUT PROMPT -->
        <div class="input-area">
            <div class="input-wrapper">
                <i class="fa-solid fa-paperclip" style="color: var(--text-muted); cursor: pointer; font-size: 18px;"></i>
                <input type="text" id="userInput" placeholder="Invia un messaggio a SuMu...">
                <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </main>

    <!-- CHAT INTERATTIVA (Simulazione) -->
    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function sendMessage() {
            const text = userInput.value.trim();
            if (text === '') return;

            // Messaggio Utente
            appendMessage(text, 'user');
            userInput.value = '';

            // Risposta simulata di SuMu
            setTimeout(() => {
                appendMessage("Ricevuto! Sto elaborando la tua richiesta con i moduli interni di SuMu.", 'bot');
            }, 1000);
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            // Se è il bot usa l'immagine Sumu.png, altrimenti usa la lettera dell'utente
            const avatarContent = sender === 'bot' 
                ? '<img src="Sumu.png" alt="SuMu Avatar">' 
                : 'U';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatarContent}</div>
                <div class="message-text">${text}</div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
